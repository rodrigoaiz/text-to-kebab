<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Kebab favicon">
    <title>Text to Kebab Case</title>
    <!-- Background (transparent) -->
    <rect width="128" height="128" fill="none" />

    <!-- Skewer (diagonal) -->
    <g transform="rotate(-30 64 64)">
        <rect x="60" y="8" width="8" height="112" rx="4" fill="#7c3aed" />

        <!-- Kebab pieces: alternating meat, pepper, onion -->
        <g>
            <rect x="36" y="14" width="40" height="18" rx="6" fill="#c2410c" />
            <rect x="36" y="36" width="40" height="14" rx="6" fill="#f97316" />
            <rect x="36" y="54" width="40" height="18" rx="6" fill="#a3e635" />
            <rect x="36" y="76" width="40" height="14" rx="6" fill="#f59e0b" />
            <rect x="36" y="94" width="40" height="18" rx="6" fill="#c2410c" />
        </g>
    </g>

    <style>
        /* Default (light) colors keep contrast */
        rect { shape-rendering: geometricPrecision; }
        @media (prefers-color-scheme: dark) {
            /* Invert skewer to be lighter on dark backgrounds */
            rect[width="8"] { fill: #a78bfa; }
            rect[width="40"][y="14"] { fill: #fb923c; }
            rect[width="40"][y="36"] { fill: #fb923c; }
            rect[width="40"][y="54"] { fill: #bbf7d0; }
            rect[width="40"][y="76"] { fill: #facc15; }
            rect[width="40"][y="94"] { fill: #fb923c; }
        }
    </style>
</svg>
